# 検証用の Mosquitto 設定(Docker の中で使う)
# 注意:allow_anonymous true は検証専用。ローカルの PC の中だけで使い、本番では認証と TLS を付ける(README §9)

listener 1883
allow_anonymous true

# 永続化:サーバーの再起動中に届いた QoS1 を取りこぼさない(ARCHITECTURE §3.1)
persistence true
persistence_location /mosquitto/data/

# 1メッセージの上限(JSON は 4 KB まで。余裕をみて 64 KB)
max_packet_size 65536

log_dest stdout
log_type error
log_type warning
log_type notice
