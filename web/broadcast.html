<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一斉送信 | Re-Ray 本部</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="page-head">
      <h1>一斉送信</h1>
      <p>つながっている全員のグラスに、同じ文字か指示を出します。</p>
    </div>
    <section class="card">
      <h2>全員に送る</h2>
      <div id="send"></div>
    </section>

    <!-- 2026-11-24 追加【案】: 端末からの依頼 #5。全端末を 平常時 / 緊急時 に切り替える -->
    <section class="card">
      <h2>全端末のモードを切り替える</h2>
      <p class="muted">切り替えると、端末のグラスに「本部から: 緊急モードに切り替えます」と出て、自動で切り替わります。
        切り替わったかは、端末一覧の「モード」で確かめられます（切れている端末は、つながったときに切り替わります）。</p>
      <div class="filters">
        <button class="btn danger" data-mode="emergency">全端末を緊急時にする</button>
        <button class="btn" data-mode="normal">全端末を平常時に戻す</button>
        <span id="mode-result" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2>最近送ったもの</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>時刻</th><th>種類</th><th>だれへ</th><th>中身</th><th>届いた数</th></tr></thead>
          <tbody id="sent"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/mode.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderHeader('broadcast.html');

    async function refresh() {
      const list = await Api.getMessages({ limit: 10 });
      $('#sent').innerHTML = list.length ? list.map(m => `<tr>
          <td>${fmtDateTime(m.sent_at)}</td>
          <td><span class="tag kind">${kindLabel(m.kind)}</span></td>
          <td>${m.dst_device_id == null ? esc(m.dst_name) : `<a href="device.html?id=${m.dst_device_id}">${esc(m.dst_name)}</a>`}</td>
          <td>${m.from_name ? `<small class="muted">${esc(m.from_name)}:</small> ` : ''}${esc(m.text)}</td>
          <td>${deliveryText(m.delivery, m.requires_response)}</td>
        </tr>`).join('')
        : '<tr><td colspan="5" class="empty">まだ送っていません</td></tr>';
    }

    document.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', async () => {
      const mode = btn.dataset.mode;
      const label = mode === 'emergency' ? '緊急時' : '平常時';
      if (!confirm(`全端末を${label}に切り替えますか？`)) return;
      const ok = await guard(() => Api.setMode(mode));
      if (ok) $('#mode-result').textContent = `${fmtTime(new Date().toISOString())} に${label}への切り替えを送りました`;
    }));

    guard(() => mountSendForm($('#send'), { deviceId: null, onSent: refresh }));
    poll(refresh);
  </script>
</body>
</html>
